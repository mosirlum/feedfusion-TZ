<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1712" />
    <title>Feed Fusion Tanzania</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Sora (display/headings/big numbers) + Inter (body/UI) — "Look A ·
         Usiku", chosen by the owner 2026-11-26 (CLAUDE.md #98). Manrope is
         kept loaded only because the light-only print documents still use it. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Sets the theme class before first paint (no flash). Must match
         ThemeContext.tsx: key 'feedfusion-theme-v2', default = dark ("Look A",
         CLAUDE.md #98). If you edit this script, recompute its sha256 for the
         CSP script-src in vercel.json (CLAUDE.md #77). -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('feedfusion-theme-v2') !== 'light') document.documentElement.classList.add('dark');
        } catch (e) { document.documentElement.classList.add('dark'); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
